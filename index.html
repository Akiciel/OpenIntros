<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open Intros</title>
  <meta name="description" content="공개 소개 페이지 아카이브.">
  <style>
    :root {
      color-scheme: dark;
      --bg: #080b12;
      --panel: #111722;
      --text: #edf3ff;
      --muted: #9ba9bb;
      --line: rgba(255, 255, 255, .12);
      --accent: #8fc7ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 18% 12%, rgba(143, 199, 255, .22), transparent 28rem),
        radial-gradient(circle at 86% 72%, rgba(255, 196, 137, .14), transparent 24rem),
        var(--bg);
      color: var(--text);
      font-family: "Pretendard", "Noto Sans KR", system-ui, sans-serif;
      line-height: 1.6;
      padding: 32px;
    }

    main {
      width: min(720px, 100%);
      border: 1px solid var(--line);
      background: color-mix(in srgb, var(--panel) 82%, transparent);
      border-radius: 10px;
      padding: clamp(28px, 5vw, 52px);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .32);
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(32px, 7vw, 56px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 16px;
    }

    a {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: center;
      padding: 18px 0;
      color: var(--text);
      text-decoration: none;
      border-top: 1px solid var(--line);
    }

    a strong {
      font-size: 20px;
      font-weight: 700;
    }

    a span {
      color: var(--accent);
      white-space: nowrap;
    }

    a:hover strong {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <main>
    <h1>Open Intros</h1>
    <p>공개용 소개 페이지를 모아두는 아카이브입니다.</p>
    <a href="academy-stern/">
      <strong>아카데미 슈테른</strong>
      <span>열기</span>
    </a>
    <a href="Magical/">
      <strong>마법소녀대전</strong>
      <span>열기</span>
    </a>
  </main>
</body>
</html>
